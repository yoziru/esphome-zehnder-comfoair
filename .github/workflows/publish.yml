name: Build and Publish ESPHome firmware and website

on:
  push:
    branches:
      - main

# Serialize deploys: parallel runs race the gh-pages ref lock and one fails
# (a push landing between fetch and push is rejected). Queue instead of
# cancelling so a deploy is never interrupted.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/publish-common.yml
    with:
      files: zehnder-comfoair-q-m5stack-atom.yml,zehnder-comfoair-q-m5stack-atoms3.yml,zehnder-comfoair-q-m5stack-nanoc6.yml
      name: Zehnder ComfoAir Q
