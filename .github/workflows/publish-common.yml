# from https://github.com/esphome/workflows/blob/main/.github/workflows/publish.yml
name: Build and Publish ESPHome firmware with secrets.yaml

on:
  workflow_call:
    inputs:
      files:
        description: Comma-separated list of files to build.
        required: true
        type: string
      legacy_files:
        description: Configurations for the legacy manifest, one per chip family. Defaults to files.
        required: false
        type: string
        default: ""
      name:
        description: Name of the firmware to publish.
        required: false
        type: string
        default: ESPHome
      clean:
        description: Remove deleted files from the build
        required: false
        type: boolean
        default: true
      manifest_filename:
        description: Filename of the manifest to write.
        required: false
        type: string
        default: manifest.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files-array.outputs.files }}
    steps:
      - id: files-array
        run: |
          files=$(echo "${{ inputs.files }}" | jq -Rcn 'inputs | . / ","')
          echo "files=$files" >> "$GITHUB_OUTPUT"

  build:
    name: Build ESPHome binary for ${{ matrix.file }}
    needs: [prepare]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.prepare.outputs.files) }}
    outputs:
      esphome-version: ${{ steps.esphome-build.outputs.esphome-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Mock secrets.yaml from example
        run: cp secrets.yaml.example secrets.yaml
      - name: Get ESPHome version
        id: get_esphome_version
        # read esphome version from requirements.txt
        run: |
          esphome_version=$(grep esphome requirements.txt | cut -d'=' -f3)
          echo "esphome_version=$esphome_version" >> "$GITHUB_OUTPUT"
      - uses: esphome/build-action@v8.1.0
        id: esphome-build
        with:
          yaml-file: ${{ matrix.file }}
          version: ${{ steps.get_esphome_version.outputs.esphome_version }}
      - name: Move generated files to output
        env:
          CONFIG_FILE: ${{ matrix.file }}
          BUILD_NAME: ${{ steps.esphome-build.outputs.name }}
          PROJECT_VERSION: ${{ steps.esphome-build.outputs.project-version }}
        run: |
          board=$(basename "$CONFIG_FILE" .yml)
          mkdir output
          mv "$BUILD_NAME" "output/$board"
          printf '%s\n' "$PROJECT_VERSION" > "output/$board/project_version"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.file }}
          path: output
          retention-days: 1

  publish:
    name: Publish new firmware and website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    # Serialize gh-pages deploys: concurrent publishes race on the gh-pages
    # push, and only the newest main state needs to win.
    concurrency:
      group: publish-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
          path: output
      - name: Create and verify board and legacy manifests
        env:
          CONFIG_FILES: ${{ inputs.files }}
          LEGACY_FILES: ${{ inputs.legacy_files }}
          PROJECT_NAME: ${{ inputs.name }}
          MANIFEST_FILENAME: ${{ inputs.manifest_filename }}
        run: |
          python3 scripts/build_manifests.py output \
            --files "$CONFIG_FILES" \
            --legacy-files "${LEGACY_FILES:-$CONFIG_FILES}" \
            --name "$PROJECT_NAME" \
            --manifest-filename "$MANIFEST_FILENAME"

      - run: cp -R static/* output

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: output
          clean: ${{ inputs.clean }}
